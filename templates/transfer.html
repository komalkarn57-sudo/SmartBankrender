<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transfer Money - SmartBank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        SmartBank
    </div>

    <nav>

        <a href="/dashboard">Dashboard</a>

        <a href="/logout">Logout</a>

    </nav>

</header>


<main class="form-section">

    <div class="form-container">

        <h2>Transfer Money</h2>

        <p>
            Transfer money to another SmartBank account.
        </p>

        <form action="/transfer" method="POST">

            <div class="form-group">

                <label>
                    Receiver Account Number
                </label>

                <input
                    type="text"
                    name="receiver_account"
                    placeholder="Enter account number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Transfer Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <input
                    type="text"
                    name="description"
                    placeholder="Example: Payment"
                    maxlength="255"
                >

            </div>


            <button type="submit" class="form-button">
                Transfer Money
            </button>

        </form>


        <p class="form-link">

            <a href="/dashboard">
                ← Back to Dashboard
            </a>

        </p>

    </div>

</main>


<footer>

    <div class="footer-content">

        <h3>SmartBank</h3>

        <p>
            Simple banking designed around your life.
        </p>

    </div>

</footer>

</body>

</html>
